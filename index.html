<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Billing System</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <h2>🍴 Pandiyan Mess</h2>

    <button onclick="showPage('billing')">
        🧾 Billing
    </button>

    <button onclick="showPage('dashboard')">
        📊 Dashboard
    </button>

    <button onclick="showPage('menu')">
        🍽️ Menu
    </button>

</div>


<!-- MAIN -->
<div class="main">

    <!-- BILLING PAGE -->
    <div id="billingPage">

        <div class="topbar">
            <h1>Hotel Billing</h1>

            <div class="date" id="today"></div>
        </div>


        <div class="category-buttons">

            <button onclick="filterFood('all')">All</button>
            <button onclick="filterFood('breakfast')">🍳 Breakfast</button>
            <button onclick="filterFood('rice')">🍚 Rice</button>
            <button onclick="filterFood('nonveg')">🍗 Non-Veg</button>
            <button onclick="filterFood('drinks')">🥤 Drinks</button>

        </div>


        <div class="billing-layout">

            <!-- FOOD ITEMS -->
            <div class="food-section">

                <h3>Select Food</h3>

                <div class="food-grid" id="foodContainer"></div>

            </div>


            <!-- CART -->
            <div class="cart">

                <h3>🧾 Current Bill</h3>

                <div id="cartItems"></div>

                <hr>

                <div class="bill-row">
                    <span>Subtotal</span>
                    <span>₹<span id="subtotal">0</span></span>
                </div>

          

                <hr>

                <div class="total">
                    <span>TOTAL</span>
                    <span>₹<span id="total">0</span></span>
                </div>

                <button class="clear-btn" onclick="clearCart()">
                    🗑 Clear
                </button>

                <button class="print-btn" onclick="printBill()">
                    🖨 PRINT BILL
                </button>

            </div>

        </div>

    </div>


    <!-- DASHBOARD -->
    <div id="dashboardPage" style="display:none">

        <h1>📊 Owner Dashboard</h1>

        <div class="dashboard-cards">

            <div class="dash-card">
                <h4>Today's Sales</h4>
                <h2>₹<span id="dashSales">0</span></h2>
            </div>

            <div class="dash-card">
                <h4>Total Orders</h4>
                <h2 id="dashOrders">0</h2>
            </div>

            <div class="dash-card">
                <h4>Items Sold</h4>
                <h2 id="dashItems">0</h2>
            </div>

        </div>


        <div class="sales-box">

            <h3>📈 Recent Sales</h3>

            <table>

                <thead>
                    <tr>
                        <th>Bill ID</th>
                        <th>Date</th>
                        <th>Items</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody id="salesTable"></tbody>

            </table>

        </div>

    </div>


    <!-- MENU PAGE -->
    <div id="menuPage" style="display:none">

        <h1>🍽️ Hotel Menu</h1>

        <p>
            Food items can be added/edited here.
        </p>

        <div id="menuList"></div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
